<div class="row" style="padding-top:8%; padding-bottom:5%;
background:url(assets/files/wall.jpg) no-repeat center center;
background-size: cover; width:100%; min-height:100vh;">

    <div class="col-sm-4"></div>

    <div class="col-sm-4">
        <div class="card">
            <div class="card-body input-group-addon grad">

                <form name="testForm">

                    <!-- Heading -->
                    <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">
                        Add CoWorking
                    </h2>

                    <h2 *ngIf="form.data.id > 0" class="text-primary font-weight-bold text-center">
                        Update CoWorking
                    </h2>

                    <!-- Success Message -->
                    <div *ngIf="!form.error && form.message" class="alert alert-success">
                        {{form.message}}
                    </div>

                    <!-- Error Message -->
                    <div *ngIf="form.error && form.message" class="alert alert-danger">
                        {{form.message}}
                    </div>

                    <!-- Space Name -->
                    <div class="form-group">
                        <span><b>Space Name</b></span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-building"></i>
                                    </div>
                                </div>

                                <input type="text" name="spaceName" [(ngModel)]="form.data.spaceName"
                                    class="form-control" placeholder="Enter Space Name">
                            </div>
                        </div>

                        <span style="color:red;">
                            {{form.inputerror.spaceName}}
                        </span>
                    </div>

                    <!-- Location -->
                    <div class="form-group">
                        <span><b>Location</b></span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-map-marker"></i>
                                    </div>
                                </div>

                                <input type="text" name="location" [(ngModel)]="form.data.location" class="form-control"
                                    placeholder="Enter Location">
                            </div>
                        </div>

                        <span style="color:red;">
                            {{form.inputerror.location}}
                        </span>
                    </div>

                    <!-- Capacity -->
                    <div class="form-group">
                        <span><b>Capacity</b></span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-users"></i>
                                    </div>
                                </div>

                                <input type="text" name="capacity" [(ngModel)]="form.data.capacity" class="form-control"
                                    placeholder="Enter Capacity">
                            </div>
                        </div>

                        <span style="color:red;">
                            {{form.inputerror.capacity}}
                        </span>
                    </div>

                    <!-- Rent -->
                    <div class="form-group">
                        <span><b>Rent</b></span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-money"></i>
                                    </div>
                                </div>

                                <input type="text" name="rent" [(ngModel)]="form.data.rent" class="form-control"
                                    placeholder="Enter Rent">
                            </div>
                        </div>

                        <span style="color:red;">
                            {{form.inputerror.rent}}
                        </span>
                    </div>

                    <!-- Buttons -->
                    <div class="row pt-2 pl-2 pb-3">

                        <div class="col-md-3"></div>

                        <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                            Save
                        </button>

                        <button *ngIf="!form.data.id" type="button" (click)="reset()" class="btn btn-dark mr-2">
                            Reset
                        </button>

                        <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                            Update
                        </button>

                        <a class="btn btn-warning" [routerLink]="['/coworkingList']">
                            List
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </div>

</div>
